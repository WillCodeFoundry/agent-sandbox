[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Launch a Docker Sandbox (sbx) agent with its own ssh-agent and a read-only context directory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.15", "ruff==0.17.0", "pytest-cov>=5", "mutmut>=3", "pre-commit>=3"]

[tool.uv]
default-groups = []  # dev tools are opt-in: `uv sync --group dev`

[project.scripts]
agent_sandbox = "agent_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["agent_sandbox"]

[tool.coverage.report]
show_missing = true

[tool.mutmut]
source_paths = ["src"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[[tool.mypy.overrides]]
# Test functions take fixtures as parameters; annotating each would mean
# importing the test doubles from conftest. Their bodies are still checked.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# The test doubles themselves stay fully typed.
module = ["tests.conftest"]
disallow_untyped_defs = true
