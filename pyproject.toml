[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Launch a Docker Sandbox (sbx) agent with its own ssh-agent and a read-only context directory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.15"]

[project.scripts]
agent_sandbox = "agent_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Test functions take fixtures as parameters; annotating each would mean
# importing the test doubles from conftest. Their bodies are still checked.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# The test doubles themselves stay fully typed.
module = ["tests.conftest"]
disallow_untyped_defs = true
