repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0  # keep equal to the ruff pin in pyproject.toml
    hooks:
      - id: ruff-format
      - id: ruff-check
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
