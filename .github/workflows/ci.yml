name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job here pins 3.11, requires-python's floor, with the locked dependency
  # set - this is what verifies the floor we claim to support actually works with
  # what we ship. latest-deps.yml covers 3.11 and newer, unlocked, on a schedule.
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest

  # Raw survivor count is not itself a merge gate: argparse help text and the
  # like are permanently unkillable mutants that need a human to triage, not
  # a threshold. What IS gated is regression against mutmut-baseline.txt -
  # already-triaged survivors are expected and fine; a *new* one means a
  # change just lost test coverage it used to have. The check itself lives in
  # scripts/check-mutmut-baseline.sh - the same script the local pre-push hook
  # runs - so there is exactly one definition of the gate.
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group dev
      # mutmut's persistent state lives under mutants/ (mutmut-stats.json), not
      # .mutmut-cache - caching it lets mutmut skip re-testing mutants whose
      # source and tests haven't changed, instead of a full run every time.
      - uses: actions/cache@v4
        with:
          path: mutants/
          key: mutmut-${{ runner.os }}-${{ hashFiles('src/**', 'tests/**', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            mutmut-${{ runner.os }}-
      - run: ./scripts/check-mutmut-baseline.sh
