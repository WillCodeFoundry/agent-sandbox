name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  # Raw survivor count is not itself a merge gate: argparse help text and the
  # like are permanently unkillable mutants that need a human to triage, not
  # a threshold. What IS gated is regression against mutmut-baseline.txt -
  # already-triaged survivors are expected and fine; a *new* one means a
  # change just lost test coverage it used to have.
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mutmut run
        continue-on-error: true
      - if: always()
        run: uv run mutmut results | sed -E 's/^[[:space:]]+//' | sort > /tmp/mutmut-current.txt
      - name: Check for new mutation survivors
        run: |
          new_survivors=$(comm -13 mutmut-baseline.txt /tmp/mutmut-current.txt)
          if [ -n "$new_survivors" ]; then
            echo "::error::New mutants survived that aren't in mutmut-baseline.txt:"
            echo "$new_survivors"
            echo
            echo "If this is expected, regenerate the baseline locally and commit it:"
            echo "  uv run mutmut run && uv run mutmut results | sed -E 's/^[[:space:]]+//' | sort > mutmut-baseline.txt"
            exit 1
          fi
          echo "No new mutation survivors."
